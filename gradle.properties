# Fichier : NetScan/gradle.properties
# Rôle : réglages Gradle/JVM du projet (Étape 1).

# JDK 17 exigé par la spec : le choisir dans Android Studio
# (File > Project Structure > SDK Location > JDK).
# Chemin forcé ici : le JBR embarqué du Flatpak n'a pas jlink
# (échec compileDebugJavaWithJavac), ce JDK 17 complet si.
# Ne pas mettre d'autre chemin en dur ici (chaque machine diffère).
# Parallélise et met en cache pour des builds plus rapides.
org.gradle.parallel=true
org.gradle.caching=true
# Utilise les espaces de noms AndroidX (obligatoire).
android.useAndroidX=true
# Les ressources non transitives évitent les références croisées fragiles.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
